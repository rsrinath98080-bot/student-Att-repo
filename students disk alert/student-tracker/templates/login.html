<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance Tracker - Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="login-page-container">
    <main class="login-card" role="main">
      <div class="login-header">
        <span class="login-header-icon" aria-hidden="true">🎓</span>
        <h1>Student Attendance Tracker</h1>
        <p>Sign in to review your attendance status, trends, and notices.</p>
      </div>

      {% if error %}
      <div class="login-error-alert" role="alert">
        <span aria-hidden="true">⚠️</span>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            autocomplete="username" 
            placeholder="e.g. noah, jordan, emma"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password" 
            placeholder="••••••••"
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="demo-credentials-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <h4>Demo Student Accounts</h4>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Password: <code>pass123</code></span>
        </div>
        <div class="demo-accounts-pills">
          <button type="button" class="demo-pill" data-user="noah">noah (Critical + Streak + Declining)</button>
          <button type="button" class="demo-pill" data-user="jordan">jordan (Streak 3+ days)</button>
          <button type="button" class="demo-pill" data-user="aaliyah">aaliyah (Declining Trend)</button>
          <button type="button" class="demo-pill" data-user="isabella">isabella (Excused vs Unexcused)</button>
          <button type="button" class="demo-pill" data-user="emma">emma (On track / All good)</button>
        </div>
      </div>

      <div style="display: flex; justify-content: center; margin-top: 1.5rem;">
        <button type="button" class="btn btn-sm btn-icon" id="theme-toggle-btn" aria-label="Toggle dark/light theme">
          <span id="theme-icon">🌓</span> <span id="theme-label" style="font-size: 0.8rem; margin-left: 0.3rem;">Auto</span>
        </button>
      </div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    // Click demo account pill to autofill
    document.querySelectorAll('.demo-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        const u = btn.getAttribute('data-user');
        document.getElementById('username').value = u;
        document.getElementById('password').value = 'pass123';
      });
    });
  </script>
</body>
</html>
